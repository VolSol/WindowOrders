version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: window-orders-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: window_orders
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345

    ports:
      - "5432:5432"

    volumes:
      - window_orders_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d window_orders"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  window_orders_data: